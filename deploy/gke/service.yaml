apiVersion: v1
kind: Service
metadata:
  name: conduit
  labels:
    app: conduit
  annotations:
    cloud.google.com/l4lb-rbs: "enabled"
spec:
  type: LoadBalancer
  selector:
    app: conduit
  ports:
  - name: mqtt-plain
    port: 1883
    targetPort: 1883
    protocol: TCP
  - name: mqtt-tls
    port: 8883
    targetPort: 8883
    protocol: TCP
  - name: api
    port: 9090
    targetPort: 9090
    protocol: TCP