apiVersion: apps/v1
kind: Deployment
metadata:
  name: conduit
  labels:
    app: conduit
spec:
  replicas: 1
  selector:
    matchLabels:
      app: conduit
  template:
    metadata:
      labels:
        app: conduit
    spec:
      containers:
      - name: conduit
        image: europe-west1-docker.pkg.dev/openwatt-prod/conduit/conduitd:latest
        imagePullPolicy: Always
        ports:
        - name: mqtt-plain
          containerPort: 1883
          protocol: TCP
        - name: mqtt-tls
          containerPort: 8883
          protocol: TCP
        - name: api
          containerPort: 9090
          protocol: TCP
        env:
        - name: RUST_LOG
          value: "conduitd=info"
        - name: CONDUIT_PLAIN_ENABLED
          value: "1"
        - name: CONDUIT_PLAIN_ADDR
          value: "0.0.0.0:1883"
        - name: CONDUIT_TLS_ADDR
          value: "0.0.0.0:8883"
        - name: CONDUIT_API_ADDR
          value: "0.0.0.0:9090"
        - name: CONDUIT_INFLUX_URL
          value: "${CONDUIT_INFLUX_URL}"
        - name: CONDUIT_INFLUX_ORG
          value: "${CONDUIT_INFLUX_ORG}"
        - name: CONDUIT_INFLUX_BUCKET
          value: "openwatt_test"
        - name: CONDUIT_REGISTRY_URL
          value: "${CONDUIT_REGISTRY_URL}"
        - name: CONDUIT_REGISTRY_RELOAD_SECS
          value: "300"
        envFrom:
        - secretRef:
            name: conduit-secrets
        resources:
          requests:
            memory: "128Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "1000m"
        readinessProbe:
          httpGet:
            path: /health
            port: 9090
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 9090
          initialDelaySeconds: 15
          periodSeconds: 20