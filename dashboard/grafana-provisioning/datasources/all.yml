apiVersion: 1
datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false

  - name: InfluxDB-OpenWatt
    type: influxdb
    access: proxy
    url: https://REDACTED_IP:8086
    jsonData:
      version: Flux
      organization: OpenWatt
      defaultBucket: openwatt
      tlsSkipVerify: true
    secureJsonData:
      token: "${INFLUXDB_TOKEN}"