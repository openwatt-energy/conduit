<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Conduit — OpenWatt MQTT</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 60 60'><defs><linearGradient id='cg' x1='0' y1='0' x2='1' y2='0'><stop offset='0%' stop-color='%23a3e635'/><stop offset='100%' stop-color='%2360a5fa'/></linearGradient></defs><rect width='60' height='60' fill='%230d1117' rx='12'/><rect x='4' y='24' width='44' height='12' rx='6' fill='none' stroke='url(%23cg)' stroke-width='2.5'/><rect x='44' y='16' width='4' height='28' rx='2' fill='none' stroke='url(%23cg)' stroke-width='2.5'/><path fill='%23a3e635' d='M20 38l6-10-2-1-2 6-3-4 1-1 8-10 7 10-2 1-1-5-3 4 1 1 8 10H20Z'/><circle cx='48' cy='16' r='14' fill='none' stroke='%231c1bb4' stroke-width='2' stroke-dasharray='4 4'/><circle cx='48' cy='16' r='5' fill='%231c1bb4'/><circle cx='10' cy='30' r='2' fill='%23a3e635' opacity='.7'/><circle cx='18' cy='30' r='2' fill='%23a3e635' opacity='.5'/><circle cx='42' cy='30' r='2' fill='%23a3e635' opacity='.7'/></svg>">
<style>
:root{color-scheme:dark;--bg:hsl(240 10% 3.9%);--fg:hsl(0 0% 98%);--card:hsl(240 3.7% 15.9%);--border:hsl(240 3.7% 15.9%);--muted:hsl(240 5% 64.9%);--muted-bg:hsl(240 3.7% 15.9%);--primary:#a3e635;--primary-fg:#0b0f0e;--indigo:#1c1bb4;--blue:#60a5fa;--green:#4ade80;--amber:#fbbf24;--red:#f87171;--radius:0.625rem;font-family:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--fg);margin:0;padding:0}
body{padding:1.25rem;max-width:1120px;margin:0 auto}
.header{display:flex;align-items:center;gap:.75rem;margin-bottom:.75rem;padding-bottom:1rem;border-bottom:1px solid var(--border)}
.header svg{flex-shrink:0}
.header h1{margin:0;font-size:1.25rem;font-weight:700;letter-spacing:-.02em;color:var(--fg)}
.header h1 span{font-weight:400;color:var(--primary)}
.header .sub{font-size:.75rem;color:var(--muted);margin-left:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:.625rem;margin-bottom:1rem}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:.85rem;transition:border-color .15s}
.card.alert{border-color:rgba(251,191,36,.4);background:#1e1b12}
.card.ok{border-color:rgba(74,222,128,.3)}
.label{font-size:.6rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:2px;font-weight:500}
.value{font-size:1.75rem;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.01em;line-height:1.1}
.value.ok{color:var(--green)}.value.warn{color:var(--amber)}.value.err{color:var(--red)}.value.info{color:var(--blue)}
.tabs{display:flex;gap:.375rem;margin-bottom:1rem}
.tab{background:var(--muted-bg);border:1px solid var(--border);color:var(--muted);padding:.35rem 1rem;border-radius:calc(var(--radius) * .75);cursor:pointer;font-size:.75rem;font-family:inherit;font-weight:500;transition:all .15s}
.tab:hover{color:var(--fg);border-color:var(--muted)}
.tab.active{background:var(--primary);color:var(--primary-fg);border-color:var(--primary)}
.hero-logo{text-align:center;padding:.5rem 0 .75rem;opacity:.9}
.panel-title{font-size:.85rem;font-weight:600;color:var(--primary);margin:0 0 .5rem;display:flex;align-items:center;gap:.5rem}
.panel-title::after{content:'';flex:1;height:1px;background:var(--border)}
.failures{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:.6rem;max-height:260px;overflow-y:auto;margin-top:.75rem}
.failures table{width:100%;border-collapse:collapse;font-size:.7rem;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.failures th{text-align:left;color:var(--muted);font-weight:600;padding:.15rem .5rem;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--card)}
.failures td{padding:.12rem .5rem;color:var(--fg);border-bottom:1px solid hsl(240 3.7% 12%)}
.failures td.err{color:var(--red)}
.log{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:.6rem;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.68rem;line-height:1.5;max-height:180px;overflow-y:auto;color:var(--muted);margin-top:.5rem}
.log .ts{color:hsl(240 3% 35%);margin-right:.35rem}
.log .ok{color:var(--green)}.log .warn{color:var(--amber)}.log .err{color:var(--red)}
.hidden{display:none}
.status-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.status-dot.online{background:var(--green);box-shadow:0 0 6px var(--green)}
.status-dot.offline{background:var(--red)}
</style>
</head>
<body>

<header class="header">
  <svg width="36" height="36" viewBox="0 0 100 100" aria-hidden="true">
     <defs>
      <filter id="gh"><feGaussianBlur stdDeviation="2"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
      <linearGradient id="ch" x1="0%" y1="100%" x2="100%" y2="0%"><stop offset="0%" stop-color="#1c1bb4"/><stop offset="50%" stop-color="#3b82f6"/><stop offset="100%" stop-color="#60a5fa"/></linearGradient>
      <linearGradient id="lh" x1="0%" y1="100%" x2="100%" y2="0%"><stop offset="0%" stop-color="#84cc16"/><stop offset="100%" stop-color="#a3e635"/></linearGradient>
    </defs>
    <rect width="100" height="100" fill="#0d1117" rx="11"/>
    <path d="M 22 72 C 18 26, 78 24, 76 28" fill="none" stroke="url(#ch)" stroke-width="15" stroke-linecap="round"/>
    <path d="M 22 72 C 18 26, 78 24, 76 28" fill="none" stroke="#070b14" stroke-width="5" stroke-linecap="round"/>
    <g filter="url(#gh)"><circle cx="22" cy="67" r="2.5" fill="#a3e635"/><circle cx="22" cy="56" r="2" fill="#a3e635" opacity=".6"/><circle cx="22" cy="46" r="2.6" fill="#a3e635"/><circle cx="37" cy="32" r="2.8" fill="#a3e635"/><circle cx="59" cy="26" r="2.5" fill="#a3e635"/><circle cx="75" cy="28" r="2.3" fill="#a3e635"/></g>
    <circle cx="22" cy="72" r="5.5" fill="#1c1bb4" filter="url(#gh)"/><circle cx="22" cy="72" r="2.8" fill="#a3e635"/>
    <circle cx="76" cy="28" r="5.5" fill="#60a5fa" filter="url(#gh)"/><circle cx="76" cy="28" r="2.8" fill="#a3e635"/>
  </svg>
  <h1>OpenWatt <span>Conduit</span></h1>
  <div class="sub" id="live-status"></div>
</header>

<div class="hero-logo">
  <svg width="96" height="96" viewBox="0 0 100 100" aria-hidden="true">
    <defs>
      <filter id="g1"><feGaussianBlur stdDeviation="2.5"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
      <linearGradient id="cg1" x1="0%" y1="100%" x2="100%" y2="0%"><stop offset="0%" stop-color="#1c1bb4"/><stop offset="50%" stop-color="#3b82f6"/><stop offset="100%" stop-color="#60a5fa"/></linearGradient>
      <linearGradient id="lg1" x1="0%" y1="100%" x2="100%" y2="0%"><stop offset="0%" stop-color="#84cc16"/><stop offset="100%" stop-color="#a3e635"/></linearGradient>
    </defs>
    <rect width="100" height="100" fill="#0d1117" rx="11"/>
    <path d="M 22 72 C 18 26, 78 24, 76 28" fill="none" stroke="url(#cg1)" stroke-width="15" stroke-linecap="round"/>
    <path d="M 22 72 C 18 26, 78 24, 76 28" fill="none" stroke="#070b14" stroke-width="5" stroke-linecap="round"/>
    <path d="M 22 72 C 18 26, 78 24, 76 28" fill="none" stroke="url(#lg1)" stroke-width="1.2" stroke-linecap="round" opacity=".3"/>
    <g filter="url(#g1)"><circle cx="22" cy="67" r="2.5" fill="#a3e635"/><circle cx="20" cy="56" r="1.8" fill="#a3e635" opacity=".65"/><circle cx="22" cy="46" r="2.6" fill="#a3e635"/><circle cx="28" cy="38" r="2" fill="#a3e635" opacity=".75"/><circle cx="37" cy="32" r="2.8" fill="#a3e635"/><circle cx="48" cy="28" r="2.2" fill="#a3e635" opacity=".7"/><circle cx="59" cy="26" r="2.5" fill="#a3e635"/><circle cx="68" cy="27" r="1.8" fill="#a3e635" opacity=".6"/><circle cx="75" cy="28" r="2.3" fill="#a3e635"/></g>
    <circle cx="22" cy="72" r="5.5" fill="#1c1bb4" filter="url(#g1)"/><circle cx="22" cy="72" r="2.8" fill="#a3e635"/>
    <circle cx="76" cy="28" r="5.5" fill="#60a5fa" filter="url(#g1)"/><circle cx="76" cy="28" r="2.8" fill="#a3e635"/>
    <circle cx="76" cy="28" r="8" fill="none" stroke="#60a5fa" stroke-width=".6" opacity=".5"/>
    <circle cx="76" cy="28" r="12" fill="none" stroke="#60a5fa" stroke-width=".4" opacity=".28"/>
  </svg>
</div>
<div class="tabs">
  <button class="tab active" onclick="switchTab('prod')">Production</button>
  <button class="tab" onclick="switchTab('test')">Test</button>
</div>

<div id="panel-prod">
  <div class="panel-title">Production — openwatt bucket</div>
  <div class="grid" id="grid-prod"></div>
  <div class="failures hidden" id="failures-prod">
    <div class="label" style="margin-bottom:.4rem">Recent Auth Failures</div>
    <table id="failures-table-prod"></table>
  </div>
  <pre class="log" id="log-prod"></pre>
</div>
<div id="panel-test" class="hidden">
  <div class="panel-title">Test — openwatt_test bucket</div>
  <div class="grid" id="grid-test"></div>
  <div class="failures hidden" id="failures-test">
    <div class="label" style="margin-bottom:.4rem">Recent Auth Failures</div>
    <table id="failures-test"></table>
  </div>
  <pre class="log" id="log-test"></pre>
</div>

<script>
var TOKEN="REDACTED_API_TOKEN";
var fmt=function(v){return v!=null?v.toLocaleString():"--";};
var uptime=function(v){var h=Math.floor(v/3600),m=Math.floor(v%3600/60),s=v%60;return h+":"+String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");};
var cards={
  connected_devices:{label:"Connected",cls:function(v){return v>0?"ok":"err";},fmt:fmt},
  messages_processed:{label:"Messages",cls:function(){return"info";},fmt:fmt},
  auth_failures:{label:"Auth Failures",cls:function(v){return v===0?"ok":"warn";},fmt:fmt},
  parse_errors:{label:"Parse Errors",cls:function(v){return v===0?"ok":"warn";},fmt:fmt},
  influx_flushed:{label:"Flushed",cls:function(){return"ok";},fmt:fmt},
  influx_failed:{label:"Failed",cls:function(v){return v===0?"ok":"err";},fmt:fmt},
  registry_entries:{label:"Registry",cls:function(){return"info";},fmt:fmt},
  uptime_secs:{label:"Uptime",cls:function(){return"ok";},fmt:uptime}};
var keys=Object.keys(cards);
var prev={prod:{count:0},test:{count:0}},lines={prod:[],test:[]};

function buildGrid(inst){
  var g=document.getElementById("grid-"+inst);
  for(var i=0;i<keys.length;i++){
    var k=keys[i],c=cards[k],d=document.createElement("div");
    d.className="card";d.id="card-"+inst+"-"+k;
    d.innerHTML='<div class="label">'+c.label+'</div><div class="value">--</div>';
    g.appendChild(d);
  }
}
buildGrid("prod");buildGrid("test");

function logLine(inst,level,msg){
  var ts=new Date().toISOString().slice(11,19);
  lines[inst].unshift('<span class="ts">'+ts+'</span> <span class="'+level+'">'+msg+'</span>');
  if(lines[inst].length>40)lines[inst].pop();
  var el=document.getElementById("log-"+inst);
  if(el)el.innerHTML=lines[inst].join("\n");
}

function poll(inst,url){
  var x=new XMLHttpRequest();
  x.open("GET",url,true);
  x.setRequestHeader("Authorization","Bearer "+TOKEN);
  x.timeout=10000;
  x.onload=function(){
    if(x.status!==200){logLine(inst,"err",x.status+" "+x.statusText);return}
    try{var d=JSON.parse(x.responseText);}catch(e){return}
    if(inst==="prod")document.getElementById("live-status").innerHTML='<span class="status-dot '+(d.connected_devices>0?"online":"offline")+'"></span>'+d.connected_devices+' online';
    for(var i=0;i<keys.length;i++){
      var k=keys[i],v=d[k],c=cards[k],el=document.getElementById("card-"+inst+"-"+k);
      if(!el)continue;
      el.querySelector(".value").textContent=c.fmt(v);
      el.querySelector(".value").className="value "+c.cls(v);
      el.className="card "+(c.cls(v)==="err"?"alert":c.cls(v)==="ok"?"ok":"");
    }
    if(d.messages_processed!==prev[inst].count&&prev[inst].count>0){
      var delta=d.messages_processed-prev[inst].count;
      logLine(inst,"ok","+"+delta+" msgs  conn="+d.connected_devices+"  flushed="+d.influx_flushed+"  failed="+d.influx_failed);
    }
    prev[inst]={count:d.messages_processed};
    var failures=d.recent_auth_failures||[],tbl=document.getElementById("failures-table-"+inst),
      box=document.getElementById("failures-"+inst);
    if(failures.length){box.classList.remove("hidden");
      tbl.innerHTML="<tr><th>Time</th><th>Username</th><th>IP</th></tr>"+failures.map(function(f){
        return "<tr><td>"+f.timestamp.slice(11,19)+"</td><td class=\"err\">"+(f.username||"")+"</td><td>"+f.ip+"</td></tr>";}).join("");}
    else box.classList.add("hidden");
  };
  x.onerror=function(){logLine(inst,"err","network error");};
  x.send();
}

setInterval(function(){poll("prod","/status");},3000);
poll("prod","/status");

function switchTab(tab){
  var tabs=document.querySelectorAll(".tab");
  for(var i=0;i<tabs.length;i++)tabs[i].classList.toggle("active",tabs[i].textContent.toLowerCase().indexOf(tab)>-1);
  document.getElementById("panel-prod").classList.toggle("hidden",tab!=="prod");
  document.getElementById("panel-test").classList.toggle("hidden",tab!=="test");
}
</script>
</body>
</html>
