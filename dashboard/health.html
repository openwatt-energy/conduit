<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Conduit — OpenWatt MQTT</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 60 60'><rect width='60' height='60' fill='%230d1117' rx='12'/><path fill='%23a3e635' d='M22 42l9-15-3-1-3 8-4-6 1-1 12-15 10 15-3 1-2-8-4 6 1 1 12 15H22z'/><circle cx='48' cy='14' r='5' fill='%231c1bb4'/></svg>">
<style>
:root{color-scheme:dark;--bg:hsl(240 10% 3.9%);--fg:hsl(0 0% 98%);--card:hsl(240 3.7% 15.9%);--border:hsl(240 3.7% 15.9%);--muted:hsl(240 5% 64.9%);--muted-bg:hsl(240 3.7% 15.9%);--primary:#a3e635;--primary-fg:#0b0f0e;--indigo:#1c1bb4;--blue:#60a5fa;--green:#4ade80;--amber:#fbbf24;--red:#f87171;--radius:0.625rem;font-family:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--fg);margin:0;padding:0}
body{padding:1.25rem;max-width:1120px;margin:0 auto}
.header{display:flex;align-items:center;gap:.75rem;margin-bottom:1rem;padding-bottom:1rem;border-bottom:1px solid var(--border)}
.header svg{flex-shrink:0}
.header h1{margin:0;font-size:1.25rem;font-weight:700;letter-spacing:-.02em;color:var(--fg)}
.header h1 span{font-weight:400;color:var(--primary)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:.625rem;margin-bottom:.75rem}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:.85rem}
.card.alert{border-color:rgba(251,191,36,.4);background:#1e1b12}
.card.ok{border-color:rgba(74,222,128,.3)}
.label{font-size:.6rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:2px;font-weight:500}
.value{font-size:1.75rem;font-weight:700;letter-spacing:-.01em;line-height:1.1}
.value.ok{color:var(--green)}.value.warn{color:var(--amber)}.value.err{color:var(--red)}.value.info{color:var(--blue)}
.panel-title{font-size:.85rem;font-weight:600;color:var(--primary);margin:.25rem 0 .5rem;display:flex;align-items:center;gap:.5rem}
.panel-title::after{content:'';flex:1;height:1px;background:var(--border)}
.debug{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.68rem;color:var(--muted);margin-top:.5rem;padding:.5rem;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);max-height:300px;overflow-y:auto;white-space:pre-wrap}
</style>
</head>
<body>
<header class="header">
  <svg width="32" height="32" viewBox="0 0 60 60" aria-hidden="true">
    <rect width="60" height="60" fill="#0d1117" rx="12"/>
    <path fill="#a3e635" d="M38 46c-2 1.6-5.4 3.8-11.3 3.8-2.2 0-8.1-.4-12.7-5.1C9.2 40 9 33.4 9 31.3c0-1.9.3-7 3.4-11.6C14.6 15.6 18.8 11 27 11c6.8 0 11 3 12.8 5 3.5 3.5 5.4 9.4 5.4 14.3 0 5.5-2.4 11.4-6.8 15l-.4.4v.3Zm-4.4-23.4c-.5-.6-1.5-1.9-3.5-2.7-1.5-.6-2.8-.7-3.4-.7-2 0-3.4.7-4 1-3.6 2-4.9 6.5-4.9 10.3 0 4.9 1.5 7.5 3 9 1.6 1.7 3.7 2.6 6 2.6 1.2 0 4-.3 6.2-2.7 2-2.2 2.8-5 2.9-7.9.1-4.5-1.3-7.5-2.3-9h-.1Z"/>
    <circle cx="52" cy="48" r="5" fill="#1c1bb4"/>
  </svg>
  <h1>OpenWatt <span>Conduit</span></h1>
  <span id="live-status" style="font-size:.75rem;color:var(--muted);margin-left:auto"></span>
</header>

<div class="panel-title">Production — openwatt bucket</div>
<div class="grid" id="grid"></div>
<div class="debug" id="log"></div>

<script>
var TOKEN="REDACTED_API_TOKEN";
var fmt=function(v){return v!=null?v.toLocaleString():"--";};
var uptime=function(v){var h=Math.floor(v/3600),m=Math.floor(v%3600/60),s=v%60;return h+":"+String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");};
var cards={
  connected_devices:{label:"Connected",cls:function(v){return v>0?"ok":"err";},fmt:fmt},
  messages_processed:{label:"Messages",cls:function(){return"info";},fmt:fmt},
  auth_failures:{label:"Auth Failures",cls:function(v){return v===0?"ok":"warn";},fmt:fmt},
  parse_errors:{label:"Parse Errors",cls:function(v){return v===0?"ok":"warn";},fmt:fmt},
  influx_flushed:{label:"Flushed",cls:function(){return"ok";},fmt:fmt},
  influx_failed:{label:"Failed",cls:function(v){return v===0?"ok":"err";},fmt:fmt},
  registry_entries:{label:"Registry",cls:function(){return"info";},fmt:fmt},
  uptime_secs:{label:"Uptime",cls:function(){return"ok";},fmt:uptime}};

var grid=document.getElementById("grid");
var keys=Object.keys(cards);
for(var i=0;i<keys.length;i++){
  var k=keys[i],c=cards[k];
  var d=document.createElement("div");d.className="card";d.id="card-"+k;
  d.innerHTML='<div class="label">'+c.label+'</div><div class="value">--</div>';
  grid.appendChild(d);
}

var lines=[];
function log(msg){lines.unshift("[LOG] "+msg);if(lines.length>30)lines.pop();document.getElementById("log").textContent=lines.join("\n");}

function poll(){
  log("fetching /status...");
  var x=new XMLHttpRequest();
  x.open("GET","/status",true);
  x.setRequestHeader("Authorization","Bearer "+TOKEN);
  x.onload=function(){
    log("XHR status: "+x.status+" len: "+x.responseText.length);
    if(x.status===200){
      try{
        var d=JSON.parse(x.responseText);
        log("parsed OK, conn: "+d.connected_devices);
        document.getElementById("live-status").innerHTML='<span style="display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:'+(d.connected_devices>0?'#4ade80':'#f87171')+';box-shadow:0 0 6px '+(d.connected_devices>0?'#4ade80':'#f87171')+'"></span>'+d.connected_devices+' online';
        for(var i=0;i<keys.length;i++){
          var k=keys[i],v=d[k],c=cards[k];
          var el=document.getElementById("card-"+k);
          if(el){
            el.querySelector(".value").textContent=c.fmt(v);
            el.querySelector(".value").className="value "+c.cls(v);
            el.className="card "+(c.cls(v)==="err"?"alert":c.cls(v)==="ok"?"ok":"");
          }
        }
      }catch(e){log("parse error: "+e);}
    }else{log("HTTP error: "+x.status);}
  };
  x.onerror=function(){log("XHR network error");};
  x.ontimeout=function(){log("XHR timeout");};
  x.timeout=10000;
  x.send();
}

poll();
setInterval(poll,3000);
</script>
</body>
</html>
