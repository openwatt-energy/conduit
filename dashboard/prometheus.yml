global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s

scrape_configs:
  - job_name: conduit
    metrics_path: /metrics
    scheme: http
    static_configs:
      - targets:
          - host.containers.internal:9090
    authorization:
      type: Bearer
      credentials: "${CONDUIT_API_TOKEN}"