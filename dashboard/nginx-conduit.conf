events {}

stream {
    # MQTT TLS proxy to conduit
    server {
        listen 8883 ssl;
        ssl_certificate /etc/nginx/cert.pem;
        ssl_certificate_key /etc/nginx/key.pem;
        proxy_pass 127.0.0.1:8884;
    }
}

http {
    # Dashboard + API proxy
    server {
        listen 8443 ssl;
        ssl_certificate /etc/nginx/cert.pem;
        ssl_certificate_key /etc/nginx/key.pem;

        location /health {
            proxy_pass http://127.0.0.1:9090/health;
        }
        location /status {
            proxy_pass http://127.0.0.1:9090/status;
        }
        location /metrics {
            proxy_pass http://127.0.0.1:9090/metrics;
        }
        location / {
            alias /etc/nginx/html/;
            index health.html;
        }
    }
}