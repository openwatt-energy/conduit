events {}

stream {
    # Prod MQTT TLS
    server {
        listen 8883 ssl;
        ssl_certificate /etc/nginx/cert.pem;
        ssl_certificate_key /etc/nginx/key.pem;
        proxy_pass 127.0.0.1:8884;
    }

    # Test MQTT TLS
    server {
        listen 8885 ssl;
        ssl_certificate /etc/nginx/cert.pem;
        ssl_certificate_key /etc/nginx/key.pem;
        proxy_pass 127.0.0.1:8886;
    }
}

http {
    # ── Prod API + dashboard ──
    server {
        listen 9090;

        # Dashboard
        location = / {
            root /etc/nginx/html;
            try_files /health.html =404;
        }

        # Prod API (default — no prefix)
        location /health { proxy_pass http://127.0.0.1:9091/health; }
        location /status { proxy_pass http://127.0.0.1:9091/status; }
        location /metrics { proxy_pass http://127.0.0.1:9091/metrics; }
        location /admin/ { proxy_pass http://127.0.0.1:9091/admin/; }
        location /command/ { proxy_pass http://127.0.0.1:9091/command/; }

        # Test API — under /test/ prefix
        location /test/health { proxy_pass http://127.0.0.1:9092/health; }
        location /test/status { proxy_pass http://127.0.0.1:9092/status; }
        location /test/metrics { proxy_pass http://127.0.0.1:9092/metrics; }
        location /test/admin/ { proxy_pass http://127.0.0.1:9092/admin/; }
        location /test/command/ { proxy_pass http://127.0.0.1:9092/command/; }
    }
}