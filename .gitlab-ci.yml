# Conduit MQTT broker — CI/CD
# Builds with limited parallelism to fit GitLab shared runners.

stages:
  - test
  - build

variables:
  GCP_PROJECT_ID: "powertrader-399210"
  GCP_REGION: "europe-west1"
  IMAGE: "europe-west1-docker.pkg.dev/${GCP_PROJECT_ID}/conduit/conduitd"
  CARGO_BUILD_JOBS: "2"

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

test:
  stage: test
  image: rust:1.98-slim-bookworm
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends pkg-config libssl-dev && rm -rf /var/lib/apt/lists/*
  script:
    - CARGO_BUILD_JOBS=2 cargo test --release -- -j 1
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

build:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  variables:
    DOCKER_BUILDKIT: "1"
    BUILDKIT_INLINE_CACHE: "1"
  before_script:
    - apk add --no-cache python3 curl
    - echo "$GCP_SA_KEY" | base64 -d > /tmp/gcp-sa.json
    - curl -fsSL https://dl.google.com/dl/cloudsdk/channels/rapid/downloads/google-cloud-cli-linux-x86_64.tar.gz | tar xz
    - ./google-cloud-sdk/bin/gcloud auth activate-service-account --key-file=/tmp/gcp-sa.json
    - ./google-cloud-sdk/bin/gcloud auth print-access-token | docker login -u oauth2accesstoken --password-stdin "https://${GCP_REGION}-docker.pkg.dev"
    - rm /tmp/gcp-sa.json
  script:
    - |
      docker pull "${IMAGE}:latest" 2>/dev/null || true
      docker build \
        --cache-from "${IMAGE}:latest" \
        --build-arg BUILDKIT_INLINE_CACHE=1 \
        --build-arg CARGO_BUILD_JOBS=2 \
        -f docker/Dockerfile \
        -t "${IMAGE}:${CI_COMMIT_SHA}" \
        -t "${IMAGE}:latest" \
        .
    - docker push "${IMAGE}:${CI_COMMIT_SHA}"
    - docker push "${IMAGE}:latest"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH